<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Force - 容器编辑器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 20px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #ffd700;
            font-size: 1.8em;
        }

        .header .controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background: #0056b3;
            transform: translateY(-1px);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-warning {
            background: #ffc107;
            color: #212529;
        }

        .btn-warning:hover {
            background: #e0a800;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .main-container {
            display: flex;
            height: calc(100vh - 70px);
        }

        .panel {
            background: rgba(0, 0, 0, 0.2);
            border-right: 1px solid rgba(255, 215, 0, 0.2);
            transition: all 0.3s ease;
            overflow-y: auto;
        }

        .panel-header {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            font-weight: bold;
            color: #ffd700;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .panel-content {
            padding: 15px;
        }

        /* 容器列表面板 */
        #container-panel {
            width: 300px;
        }

        .container-item {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .container-item:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 215, 0, 0.6);
            transform: translateY(-1px);
        }

        .container-item.selected {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
        }

        .container-name {
            font-weight: bold;
            margin-bottom: 5px;
            color: #ffd700;
        }

        .container-info {
            font-size: 12px;
            color: #cccccc;
            line-height: 1.4;
        }

        .container-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 11px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .quality-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .quality-1 { background: #9e9e9e; }
        .quality-2 { background: #4caf50; }
        .quality-3 { background: #2196f3; }
        .quality-4 { background: #9c27b0; }
        .quality-5 { background: #ff9800; }
        .quality-6 { background: #f44336; }

        /* 编辑器面板 */
        #editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .editor-header {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            font-weight: bold;
            color: #ffd700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-actions {
            display: flex;
            gap: 8px;
        }

        .editor-content {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .form-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-section h3 {
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            flex: 1;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #bdc3c7;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.3);
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* 物品池编辑器 */
        #item-pool-panel {
            width: 450px;
        }

        .item-pool-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .item-search {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.3);
            color: #ffffff;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .item-categories {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 15px;
            max-height: 120px;
            overflow-y: auto;
            padding: 5px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
        }

        .category-btn {
            padding: 4px 8px;
            font-size: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.3);
            color: #ccc;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .category-btn:hover,
        .category-btn.active {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
            color: #ffd700;
        }

        .item-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
        }

        .item-option {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            padding: 10px;
            display: flex;
            align-items: flex-start;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 60px;
        }

        .item-option:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 215, 0, 0.5);
        }

        .item-option.selected {
            background: rgba(255, 215, 0, 0.15);
            border-color: #ffd700;
        }

        .item-checkbox {
            margin-right: 10px;
            accent-color: #ffd700;
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-size: 12px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .item-meta {
            font-size: 11px;
            color: #999;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }

        .item-quality {
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: bold;
        }

        .item-category {
            padding: 1px 4px;
            border-radius: 2px;
            font-size: 8px;
            background: rgba(100, 149, 237, 0.3);
            color: #6495ED;
            border: 1px solid rgba(100, 149, 237, 0.5);
        }

        .item-size-badge {
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: bold;
            background: rgba(255, 152, 0, 0.2);
            color: #FF9800;
            border: 1px solid rgba(255, 152, 0, 0.5);
            font-family: monospace;
        }

        .item-desc {
            font-size: 8px;
            color: #666;
            margin-top: 2px;
            max-height: 16px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .quality-common { background: #888; color: white; }
        .quality-uncommon { background: #4CAF50; color: white; }
        .quality-rare { background: #2196F3; color: white; }
        .quality-epic { background: #9C27B0; color: white; }
        .quality-legendary { background: #FF9800; color: white; }
        .quality-mythic { background: #F44336; color: white; }
        
        /* 中文品质样式 */
        .quality-普通 { background: #888; color: white; }
        .quality-优秀 { background: #4CAF50; color: white; }
        .quality-稀有 { background: #2196F3; color: white; }
        .quality-史诗 { background: #9C27B0; color: white; }
        .quality-传说 { background: #FF9800; color: white; }
        .quality-神话 { background: #F44336; color: white; }

        /* 保存状态指示器 */
        .save-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .save-indicator.success {
            background: #28a745;
            color: white;
        }

        .save-indicator.error {
            background: #dc3545;
            color: white;
        }

        .save-indicator.show {
            opacity: 1;
        }

        /* 容器预览 */
        .container-preview {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .preview-grid {
            display: grid;
            gap: 2px;
            max-width: 200px;
            margin: 10px auto;
        }

        .preview-cell {
            background: rgba(255, 255, 255, 0.1);
            aspect-ratio: 1;
            border-radius: 2px;
            min-width: 20px;
            min-height: 20px;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
        }

        .stat-label {
            font-size: 11px;
            color: #ccc;
            margin-top: 2px;
        }

        /* 响应式设计 */
        @media (max-width: 1200px) {
            #container-panel {
                width: 250px;
            }
            #item-pool-panel {
                width: 400px;
            }
        }

        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
            }
            
            #container-panel,
            #item-pool-panel {
                width: 100%;
                max-height: 200px;
            }
        }
    </style>
</head>
<body>
    <!-- 头部工具栏 -->
    <div class="header">
        <h1>🎯 Delta Force - 容器编辑器</h1>
        <div class="controls">
            <button class="btn btn-success" onclick="saveContainer()">保存容器</button>
            <button class="btn btn-primary" onclick="addContainer()">新增容器</button>
            <button class="btn btn-warning" onclick="resetContainer()">重置</button>
            <button class="btn btn-danger" onclick="loadContainerData()">重新加载</button>
        </div>
    </div>

    <!-- 主要内容区域 -->
    <div class="main-container">
        <!-- 左侧：容器列表 -->
        <div class="panel" id="container-panel">
            <div class="panel-header">容器列表</div>
            <div class="panel-content">
                <div id="container-list">
                    <!-- 动态加载容器列表 -->
                </div>
            </div>
        </div>

        <!-- 中间：编辑器 -->
        <div class="panel" id="editor-panel">
            <div class="editor-header">
                <span id="editor-title">请选择一个容器进行编辑</span>
                <div class="editor-actions">
                    <button class="btn btn-primary btn-sm" onclick="testContainer()" id="test-btn" style="display: none;">测试开箱</button>
                </div>
            </div>
            <div class="editor-content" id="editor-content">
                <div class="container-preview">
                    <h3>容器预览</h3>
                    <div class="preview-grid" id="preview-grid"></div>
                    <div class="stats-summary">
                        <div class="stat-card">
                            <div class="stat-value" id="stat-items">0</div>
                            <div class="stat-label">物品池大小</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="stat-range">0-0</div>
                            <div class="stat-label">物品数量</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="stat-cost">0</div>
                            <div class="stat-label">开启成本</div>
                        </div>
                    </div>
                </div>

                <!-- 基本信息 -->
                <div class="form-section">
                    <h3>基本信息</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>容器名称</label>
                            <input type="text" id="container-name" placeholder="输入容器名称">
                        </div>
                        <div class="form-group">
                            <label>品质等级</label>
                            <select id="container-quality">
                                <option value="1">普通 (1级)</option>
                                <option value="2">稀有 (2级)</option>
                                <option value="3">史诗 (3级)</option>
                                <option value="4">传奇 (4级)</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>描述</label>
                            <textarea id="container-desc" placeholder="输入容器描述"></textarea>
                        </div>
                    </div>
                </div>

                <!-- 容器配置 -->
                <div class="form-section">
                    <h3>容器配置</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>容器宽度</label>
                            <input type="number" id="container-width" min="3" max="8" value="5">
                        </div>
                        <div class="form-group">
                            <label>容器高度</label>
                            <input type="number" id="container-height" min="3" max="8" value="5">
                        </div>
                        <div class="form-group">
                            <label>开启成本</label>
                            <input type="number" id="container-cost" min="0" value="100">
                        </div>
                        <div class="form-group">
                            <label>颜色</label>
                            <input type="color" id="container-color" value="#4CAF50">
                        </div>
                    </div>
                </div>

                <!-- 动态生成配置 -->
                <div class="form-section">
                    <h3>物品生成设置</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>最少物品数量</label>
                            <input type="number" id="min-items" min="1" max="20" value="3">
                        </div>
                        <div class="form-group">
                            <label>最多物品数量</label>
                            <input type="number" id="max-items" min="1" max="20" value="6">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>详细描述</label>
                        <textarea id="container-description" placeholder="输入详细描述"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧：物品池管理 -->
        <div class="panel" id="item-pool-panel">
            <div class="panel-header">物品池管理</div>
            <div class="panel-content">
                <div class="item-pool-header">
                    <input type="text" class="item-search" id="item-search" placeholder="搜索物品...">
                </div>
                
                <div class="item-categories">
                    <button class="category-btn active" data-category="all">全部</button>
                    <button class="category-btn" data-category="1">工艺藏品</button>
                    <button class="category-btn" data-category="2">工具材料</button>
                    <button class="category-btn" data-category="3">电子物品</button>
                    <button class="category-btn" data-category="4">家居物品</button>
                    <button class="category-btn" data-category="5">能源燃料</button>
                    <button class="category-btn" data-category="6">医疗道具</button>
                    <button class="category-btn" data-category="7">资料情报</button>
                    <button class="category-btn" data-category="8">头盔</button>
                    <button class="category-btn" data-category="9">护甲</button>
                    <button class="category-btn" data-category="10">胸挂</button>
                    <button class="category-btn" data-category="11">背包</button>
                </div>

                <div class="item-pool-actions" style="margin-bottom: 15px;">
                    <button class="btn btn-success btn-sm" onclick="selectAllItems()">全选</button>
                    <button class="btn btn-warning btn-sm" onclick="clearSelection()">清空</button>
                    <button class="btn btn-primary btn-sm" onclick="selectByQuality()">按品质选择</button>
                </div>

                <div class="item-grid" id="item-grid">
                    <!-- 动态加载物品列表 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 保存状态指示器 -->
    <div class="save-indicator" id="save-indicator"></div>

    <script>
        // 全局变量
        let containerData = {};
        let itemData = {};
        let currentContainer = null;
        let selectedItems = new Set();
        let currentCategory = 'all';

        // 初始化编辑器
        async function initEditor() {
            try {
                await loadContainerData();
                await loadItemData();
                renderContainerList();
                renderItemGrid();
                attachEventListeners();
                showMessage('编辑器初始化完成', 'success');
            } catch (error) {
                console.error('初始化失败:', error);
                showMessage('初始化失败: ' + error.message, 'error');
            }
        }

        // 加载容器数据
        async function loadContainerData() {
            try {
                const response = await fetch('/json/containers.json');
                containerData = await response.json();
                console.log('容器数据加载完成:', containerData);
            } catch (error) {
                console.error('加载容器数据失败:', error);
                throw error;
            }
        }

        // 加载物品数据
        async function loadItemData() {
            try {
                const response = await fetch('/json/items.json');
                const data = await response.json();
                itemData = data;
                console.log('物品数据加载完成:', Object.keys(itemData).length, '个物品');
            } catch (error) {
                console.error('加载物品数据失败:', error);
                throw error;
            }
        }

        // 渲染容器列表
        function renderContainerList() {
            const containerList = document.getElementById('container-list');
            containerList.innerHTML = '';

            Object.values(containerData).forEach(container => {
                const item = document.createElement('div');
                item.className = 'container-item';
                item.dataset.containerId = container.id;
                
                const qualityClass = `quality-${container.quality}`;
                const itemPoolSize = container.itemPool ? container.itemPool.length : 0;
                
                item.innerHTML = `
                    <div class="container-name">${container.name}</div>
                    <div class="container-info">${container.desc || ''}</div>
                    <div class="container-stats">
                        <div class="stat-item">
                            <span class="quality-indicator ${qualityClass}"></span>
                            <span>品质 ${container.quality}</span>
                        </div>
                        <div class="stat-item">
                            <span>物品池: ${itemPoolSize}</span>
                        </div>
                        <div class="stat-item">
                            <span>${container.minItems || 0}-${container.maxItems || 0}个</span>
                        </div>
                    </div>
                `;

                item.addEventListener('click', () => selectContainer(container.id));
                containerList.appendChild(item);
            });
        }

        // 渲染物品网格
        function renderItemGrid() {
            const itemGrid = document.getElementById('item-grid');
            itemGrid.innerHTML = '';

            const filteredItems = filterItems();

            filteredItems.forEach(item => {
                const option = document.createElement('div');
                option.className = 'item-option';
                option.dataset.itemId = item.id;
                
                const qualityName = getQualityName(item.quality);
                const categoryName = getCategoryName(item.category.toString());
                const isSelected = selectedItems.has(item.id);
                
                option.innerHTML = `
                    <input type="checkbox" class="item-checkbox" ${isSelected ? 'checked' : ''}>
                    <div class="item-details">
                        <div class="item-name">${item.name}</div>
                        <div class="item-meta">
                            <span class="item-quality quality-${qualityName}">${qualityName}</span>
                            <span class="item-size-badge">${item.size}</span>
                            <span class="item-category">${categoryName}</span>
                        </div>
                        <div class="item-desc">${item.desc || ''}</div>
                    </div>
                `;

                if (isSelected) {
                    option.classList.add('selected');
                }

                option.addEventListener('click', (e) => {
                    if (e.target.type !== 'checkbox') {
                        const checkbox = option.querySelector('.item-checkbox');
                        checkbox.checked = !checkbox.checked;
                    }
                    toggleItemSelection(item.id, option);
                });

                itemGrid.appendChild(option);
            });
        }

        // 过滤物品
        function filterItems() {
            const searchTerm = document.getElementById('item-search').value.toLowerCase();
            const items = Object.values(itemData);
            
            return items.filter(item => {
                const matchesSearch = !searchTerm || 
                    item.name.toLowerCase().includes(searchTerm) ||
                    item.id.toString().includes(searchTerm);
                
                const matchesCategory = currentCategory === 'all' || 
                    getCategoryFromItem(item) === currentCategory;
                
                return matchesSearch && matchesCategory;
            });
        }

        // 根据物品获取分类
        function getCategoryFromItem(item) {
            // 直接返回物品的category字段
            return item.category ? item.category.toString() : '1';
        }

        // 获取分类名称
        function getCategoryName(categoryId) {
            const categoryMap = {
                '1': '工艺藏品',
                '2': '工具材料',
                '3': '电子物品',
                '4': '家居物品',
                '5': '能源燃料',
                '6': '医疗道具',
                '7': '资料情报',
                '8': '头盔',
                '9': '护甲',
                '10': '胸挂',
                '11': '背包'
            };
            return categoryMap[categoryId] || '未知分类';
        }

        // 获取品质名称
        function getQualityName(quality) {
            const qualityMap = {
                1: '普通',
                2: '优秀', 
                3: '稀有',
                4: '史诗',
                5: '传说',
                6: '神话'
            };
            return qualityMap[quality] || '普通';
        }

        // 选择容器
        function selectContainer(containerId) {
            // 移除之前选中的容器高亮
            document.querySelectorAll('.container-item').forEach(item => {
                item.classList.remove('selected');
            });
            
            // 高亮当前选中的容器
            const containerElement = document.querySelector(`[data-container-id="${containerId}"]`);
            if (containerElement) {
                containerElement.classList.add('selected');
            }

            currentContainer = containerData[containerId];
            
            if (currentContainer) {
                loadContainerToEditor(currentContainer);
                document.getElementById('test-btn').style.display = 'inline-block';
            }
        }

        // 加载容器到编辑器
        function loadContainerToEditor(container) {
            document.getElementById('editor-title').textContent = `编辑容器: ${container.name}`;
            
            // 填充表单
            document.getElementById('container-name').value = container.name || '';
            document.getElementById('container-quality').value = container.quality || 1;
            document.getElementById('container-desc').value = container.desc || '';
            document.getElementById('container-width').value = container.width || 5;
            document.getElementById('container-height').value = container.height || 5;
            document.getElementById('container-cost').value = container.cost || 100;
            document.getElementById('container-color').value = container.color || '#4CAF50';
            document.getElementById('min-items').value = container.minItems || 3;
            document.getElementById('max-items').value = container.maxItems || 6;
            document.getElementById('container-description').value = container.description || '';
            
            // 设置选中的物品
            selectedItems.clear();
            if (container.itemPool) {
                container.itemPool.forEach(itemId => {
                    selectedItems.add(itemId.toString());
                });
            }
            
            // 重新渲染物品网格和预览
            renderItemGrid();
            updatePreview();
        }

        // 切换物品选择
        function toggleItemSelection(itemId, optionElement) {
            const checkbox = optionElement.querySelector('.item-checkbox');
            
            if (checkbox.checked) {
                selectedItems.add(itemId.toString());
                optionElement.classList.add('selected');
            } else {
                selectedItems.delete(itemId.toString());
                optionElement.classList.remove('selected');
            }
            
            updatePreview();
        }

        // 更新预览
        function updatePreview() {
            const width = parseInt(document.getElementById('container-width').value) || 5;
            const height = parseInt(document.getElementById('container-height').value) || 5;
            const minItems = parseInt(document.getElementById('min-items').value) || 3;
            const maxItems = parseInt(document.getElementById('max-items').value) || 6;
            const cost = parseInt(document.getElementById('container-cost').value) || 100;
            
            // 更新预览网格
            const previewGrid = document.getElementById('preview-grid');
            previewGrid.style.gridTemplateColumns = `repeat(${width}, 1fr)`;
            previewGrid.innerHTML = '';
            
            for (let i = 0; i < width * height; i++) {
                const cell = document.createElement('div');
                cell.className = 'preview-cell';
                previewGrid.appendChild(cell);
            }
            
            // 更新统计信息
            document.getElementById('stat-items').textContent = selectedItems.size;
            document.getElementById('stat-range').textContent = `${minItems}-${maxItems}`;
            document.getElementById('stat-cost').textContent = cost;
        }

        // 附加事件监听器
        function attachEventListeners() {
            // 分类按钮事件
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentCategory = e.target.dataset.category;
                    renderItemGrid();
                });
            });

            // 搜索事件
            document.getElementById('item-search').addEventListener('input', () => {
                renderItemGrid();
            });

            // 容器参数变化事件
            ['container-width', 'container-height', 'min-items', 'max-items', 'container-cost'].forEach(id => {
                document.getElementById(id).addEventListener('input', updatePreview);
            });
        }

        // 保存容器
        async function saveContainer() {
            if (!currentContainer) {
                showMessage('请先选择一个容器', 'error');
                return;
            }

            try {
                // 收集表单数据
                const updatedContainer = {
                    ...currentContainer,
                    name: document.getElementById('container-name').value,
                    desc: document.getElementById('container-desc').value,
                    quality: parseInt(document.getElementById('container-quality').value),
                    width: parseInt(document.getElementById('container-width').value),
                    height: parseInt(document.getElementById('container-height').value),
                    cost: parseInt(document.getElementById('container-cost').value),
                    color: document.getElementById('container-color').value,
                    minItems: parseInt(document.getElementById('min-items').value),
                    maxItems: parseInt(document.getElementById('max-items').value),
                    description: document.getElementById('container-description').value,
                    itemPool: Array.from(selectedItems)
                };

                // 验证数据
                if (!updatedContainer.name.trim()) {
                    throw new Error('容器名称不能为空');
                }
                
                if (updatedContainer.minItems > updatedContainer.maxItems) {
                    throw new Error('最少物品数量不能大于最多物品数量');
                }
                
                if (selectedItems.size === 0) {
                    throw new Error('请至少选择一个物品');
                }

                // 调用API保存到服务器
                console.log('准备保存容器:', updatedContainer.id, updatedContainer.name);
                console.log('请求URL:', `http://localhost:3001/api/containers/${currentContainer.id}`);
                console.log('请求数据:', JSON.stringify(updatedContainer, null, 2));
                
                const response = await fetch(`http://localhost:3001/api/containers/${currentContainer.id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(updatedContainer)
                });

                console.log('响应状态:', response.status, response.statusText);
                console.log('响应头:', [...response.headers.entries()]);

                if (!response.ok) {
                    let errorMessage;
                    try {
                        const errorData = await response.json();
                        errorMessage = errorData.message || `服务器错误: ${response.status}`;
                    } catch (e) {
                        const errorText = await response.text();
                        errorMessage = errorText || `HTTP错误: ${response.status} ${response.statusText}`;
                    }
                    throw new Error(errorMessage);
                }

                const result = await response.json();
                console.log('保存结果:', result);

                // 更新本地数据
                containerData[currentContainer.id] = updatedContainer;
                currentContainer = updatedContainer;
                
                // 重新渲染列表
                renderContainerList();
                
                showMessage('容器保存成功', 'success');
            } catch (error) {
                console.error('保存失败:', error);
                showMessage('保存失败: ' + error.message, 'error');
            }
        }

        // 新增容器
        async function addContainer() {
            try {
                const newId = Math.max(...Object.keys(containerData).map(id => parseInt(id))) + 1;
                const newContainer = {
                    id: newId.toString(),
                    name: `新容器 ${newId}`,
                    desc: '新建的容器',
                    quality: 1,
                    width: 5,
                    height: 5,
                    cost: 100,
                    color: '#4CAF50',
                    minItems: 3,
                    maxItems: 6,
                    description: '',
                    itemPool: []
                };
                
                // 先在本地添加容器，这样PUT请求就能找到它
                containerData[newId.toString()] = newContainer;
                
                // 调用API创建容器
                const response = await fetch(`http://localhost:3001/api/containers/${newId.toString()}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(newContainer)
                });

                if (!response.ok) {
                    // 如果API调用失败，移除本地添加的容器
                    delete containerData[newId.toString()];
                    const errorData = await response.json();
                    throw new Error(errorData.message || `服务器错误: ${response.status}`);
                }

                renderContainerList();
                selectContainer(newId.toString());
                showMessage('新容器创建成功', 'success');
            } catch (error) {
                console.error('创建容器失败:', error);
                showMessage('创建失败: ' + error.message, 'error');
            }
        }

        // 重置容器
        function resetContainer() {
            if (!currentContainer) {
                showMessage('请先选择一个容器', 'error');
                return;
            }
            
            if (confirm('确定要重置当前容器的所有修改吗？')) {
                loadContainerToEditor(currentContainer);
                showMessage('容器已重置', 'success');
            }
        }

        // 测试容器
        function testContainer() {
            if (!currentContainer) {
                showMessage('请先选择一个容器', 'error');
                return;
            }
            
            // 打开主应用测试（这里可以打开新窗口或切换到主应用）
            const testUrl = `/?container=${currentContainer.id}`;
            window.open(testUrl, '_blank');
        }

        // 全选物品
        function selectAllItems() {
            const filteredItems = filterItems();
            filteredItems.forEach(item => {
                selectedItems.add(item.id.toString());
            });
            renderItemGrid();
            updatePreview();
            showMessage(`已选择 ${filteredItems.length} 个物品`, 'success');
        }

        // 清空选择
        function clearSelection() {
            selectedItems.clear();
            renderItemGrid();
            updatePreview();
            showMessage('已清空选择', 'success');
        }

        // 按品质选择
        function selectByQuality() {
            const quality = prompt('请输入要选择的品质等级 (1-5):', '3');
            if (quality && quality >= 1 && quality <= 5) {
                const filteredItems = filterItems();
                const qualityItems = filteredItems.filter(item => item.quality == quality);
                
                qualityItems.forEach(item => {
                    selectedItems.add(item.id.toString());
                });
                
                renderItemGrid();
                updatePreview();
                showMessage(`已选择 ${qualityItems.length} 个品质 ${quality} 的物品`, 'success');
            }
        }

        // 显示消息
        function showMessage(message, type = 'success') {
            const indicator = document.getElementById('save-indicator');
            indicator.textContent = message;
            indicator.className = `save-indicator ${type} show`;
            
            setTimeout(() => {
                indicator.classList.remove('show');
            }, 3000);
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initEditor);
    </script>
</body>
</html>
